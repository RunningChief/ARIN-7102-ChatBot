<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Medical Q&A Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .password-form {
            width: 50%;
            max-width: 800px;
            margin: 3rem auto;
            padding: 3.5rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
>
>
>
        .form-group {
            margin-bottom: 2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 1rem;
            font-weight: 600;
            color: #444;
            font-size: 1rem;
        }
        .form-group input {
            width: 100%;
            padding: 1.2rem;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1.1rem;
            transition: border-color 0.3s;
        }
>
>
        .form-group input:focus {
            border-color: #4a6baf;
            outline: none;
            box-shadow: 0 0 0 2px rgba(74, 107, 175, 0.2);
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 2.5rem;
        }
        .btn {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
>
        .btn-primary {
            background-color: #4a6baf;
            color: white;
        }
        .btn-secondary {
            background-color: #f5f5f5;
            color: #555;
            border: 1px solid #e0e0e0;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .confirm-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .confirm-content {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .confirm-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }
>
    </style>
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <h1>Change Password</h1>
>
        </nav>

        <div class="main-content">
            <form id="passwordForm" class="password-form">
                <div class="form-group">
                    <label for="currentPassword">Original password</label>
                    <input type="password" id="currentPassword" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <div class="form-actions">
                    <button type="button" id="backButton" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Confirm</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div id="confirmDialog" class="confirm-dialog">
        <div class="confirm-content">
            <h3>Warning</h3>
            <p>Sure to change your password?</p>
            <div class="confirm-buttons">
                <button id="cancelConfirm" class="btn btn-secondary">Cancel</button>
                <button id="confirmChange" class="btn btn-primary">Yes</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordForm = document.getElementById('passwordForm');
            const backButton = document.getElementById('backButton');
            const confirmDialog = document.getElementById('confirmDialog');
            const cancelConfirm = document.getElementById('cancelConfirm');
            const confirmChange = document.getElementById('confirmChange');
            const token = localStorage.getItem('authToken');

            // 返回按钮
            backButton.addEventListener('click', function() {
                window.history.back();
            });

            // 表单提交
            passwordForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // 验证新密码是否匹配
                if (newPassword !== confirmPassword) {
                    alert('新密码与确认密码不匹配');
                    return;
                }

                // 显示确认对话框
                confirmDialog.style.display = 'flex';
            });

            // 确认对话框取消
            cancelConfirm.addEventListener('click', function() {
                confirmDialog.style.display = 'none';
            });

            // 确认修改密码
            confirmChange.addEventListener('click', function() {
                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;

                fetch('/api/change_password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                })
                .then(response => {
                    if (response.status === 401) {
                        return response.json().then(data => {
                            throw new Error(data.message || '密码验证失败');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        alert('密码修改成功，请重新登录');
                        // 清除登录状态
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('username');
                        // 跳转到登录页
                        window.location.href = '/static/login.html';
                    } else {
                        throw new Error(data.message || '密码修改失败');
                    }
                })
                .catch(error => {
                    alert(error.message);
                    confirmDialog.style.display = 'none';
                });
            });
        });
    </script>
</body>
</html>
